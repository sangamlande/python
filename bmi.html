<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; text-align: center; background-color: #f4f4f9; }
        .container { max-width: 400px; margin: auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 95%; padding: 10px; background: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>

<div class="container">
    <h2>BMI Calculator</h2>
    <input type="number" id="weight" placeholder="Weight (in kg)" step="0.1">
    <input type="number" id="height" placeholder="Height (in meters)" step="0.01">
    <button onclick="calculateBMI()">Calculate BMI</button>
    <div id="result"></div>
</div>

<script>
    function calculateBMI() {
        const weight = parseFloat(document.getElementById('weight').value);
        const height = parseFloat(document.getElementById('height').value);
        
        if (isNaN(weight) || isNaN(height) || height <= 0 || weight <= 0) {
            document.getElementById('result').innerText = "Please enter valid numbers.";
            return;
        }

        const bmi = weight / (height * height);
        let category = "";

        if (bmi < 18.5) category = "Underweight";
        else if (bmi < 25) category = "Healthy Weight";
        else if (bmi < 30) category = "Overweight";
        else category = "Obesity";

        document.getElementById('result').innerHTML = `Your BMI is: ${bmi.toFixed(2)}<br><span style="color: blue;">Category: ${category}</span>`;
    }
</script>

</body>
</html>
